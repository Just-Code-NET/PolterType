[workspace]
resolver = "2"
members = [
    "crates/poltertype-app",
    "crates/poltertype-core",
    "crates/poltertype-input",
    "crates/poltertype-layout",
    "crates/poltertype-detect",
    "crates/poltertype-update",
    "crates/poltertype-ai",
    "crates/poltertype-popup",
    "crates/poltertype-autostart",
    "crates/poltertype-shell",
    "crates/poltertype-tray",
    "crates/poltertype-types",
    "crates/poltertype-icon",
    "xtask",
]

[workspace.package]
version       = "0.30.0"
edition       = "2024"
license       = "MIT"
authors       = ["PolterType contributors"]
rust-version  = "1.85"
repository    = "https://github.com/Just-Code-NET/poltertype"
# Internal crates, distributed as the poltertype-app binary via GitHub
# Releases — never published to crates.io. (Also what lets
# cargo-deny accept the versionless path-only workspace deps.)
publish       = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all           = { level = "warn", priority = -1 }
unwrap_used   = "warn"
expect_used   = "warn"
panic         = "warn"
todo          = "allow"
unimplemented = "allow"

[workspace.dependencies]
# Internal crates
poltertype-types  = { path = "crates/poltertype-types" }
poltertype-input  = { path = "crates/poltertype-input" }
poltertype-layout = { path = "crates/poltertype-layout" }
poltertype-detect = { path = "crates/poltertype-detect" }
poltertype-core   = { path = "crates/poltertype-core" }
poltertype-update = { path = "crates/poltertype-update" }
poltertype-autostart = { path = "crates/poltertype-autostart" }
poltertype-shell  = { path = "crates/poltertype-shell" }
poltertype-ai     = { path = "crates/poltertype-ai" }
poltertype-popup  = { path = "crates/poltertype-popup" }
poltertype-tray   = { path = "crates/poltertype-tray" }
# Build-time only: the app's icon resource and the installers' images
# are drawn from the same geometry, so they cannot drift apart.
poltertype-icon   = { path = "crates/poltertype-icon" }

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender   = "0.2"

# Concurrency
crossbeam-channel = "0.5"
parking_lot       = "0.12"

# Serde / config
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
# Format-preserving TOML, for editing a plug-in's own config file
# without destroying the comments its author wrote for the user.
# Already in the tree as a dependency of `toml`, so this vendors
# nothing new.
toml_edit  = "0.20"

# OS interop
directories = "5"
keyring     = "3"

# Errors
thiserror = "1"
anyhow    = "1"

# Event loop / tray / hotkeys / autostart / single instance
tao             = "0.30"
tray-icon       = "0.19"
global-hotkey   = "0.6"
single-instance = "0.3"
# Linux tray only (poltertype-tray): `tray-icon` already pulls this in
# via `libappindicator`, so pinning it here buys a handle on GLib's log
# router, not a new dependency. Keep the version in step with whatever
# `tray-icon` resolves, or two copies of glib land in the tree.
glib            = "0.18"

# Audio
rodio = "0.20"

# Notifications
notify-rust = "4"

# Bitflags for modifier sets, etc.
bitflags = "2"

# Compact immutable set/map for embedded dictionaries (BurntSushi).
fst = "0.4"

# Levenshtein DFAs for the suggestions engine: compiles a typed token
# into an edit-distance automaton that streams every dictionary word
# within distance N straight off the surface FST. NOT fst's built-in
# `levenshtein` feature — that automaton mismatches multibyte (Cyrillic)
# queries entirely (even `слово` within d=1 of itself finds nothing).
# This crate (tantivy's) handles UTF-8 correctly and counts adjacent
# transpositions as single edits, which matches how humans mistype.
levenshtein_automata = "0.2"

# Cross-platform "open this file in the user's default app".
opener = "0.7"

# Auto-update (poltertype-update only). `ureq` is blocking and
# rustls-backed — no async runtime, no OpenSSL, and it is already the
# HTTP client xtask uses to fetch wordlists, so the dependency tree
# (and its licence set in deny.toml) is vetted. `sha2` verifies the
# downloaded artifact against the checksum in the release manifest;
# `semver` decides "is the published version actually newer than us".
ureq   = { version = "2", features = ["tls", "json"] }
sha2   = "0.10"
semver = "1"
# Manifest signing. Verification only in the app — no key generation,
# no signing, so `default-features = false` drops `zeroize` (nothing
# secret is ever in the app's memory) and the precomputed tables. The
# signing half lives in `xtask`, which turns those features back on.
# `base64` is already in the tree via ureq/rustls; it decodes the
# 32-byte key and the 64-byte signature.
ed25519-dalek = { version = "3", default-features = false }
base64        = "0.22"

# GUI for the Settings window. `tiny-skia` is iced's pure-CPU
# renderer (no wgpu / GPU stack) — keeps the binary small and the
# build snappy, which matters because we open this window rarely.
# `advanced` exposes the lower-level layout/widget API used for the
# custom side-nav. `image-without-codecs` is the image widget with no
# decoders compiled in: the brand mark arrives as an RGBA buffer from
# `poltertype-icon`, and nothing in this window ever loads an image
# file. It replaced `canvas`, which drew the mark as vectors until its
# tiny-skia backend masked it away — see DECISIONS, 2026-08-30.
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia",
    "advanced",
    "linux-theme-detection",
    "image-without-codecs",
    "wayland",
    "x11",
    "thread-pool",
] }

# Linux: evdev / X11. (poltertype-layout's D-Bus access stays a
# shell-out to canonical CLI tools — see crates/poltertype-layout/
# src/linux/ — those are one-shot queries. The AT-SPI caret watcher
# in poltertype-input needs a long-lived signal subscription, which a
# CLI shell-out cannot provide, so it links zbus directly.)
evdev = "0.13"
x11rb = "0.13"

# Selection conversion (issue #32) reads and writes the clipboard from a
# process that never holds focus. `wayland-data-control` is what makes
# that possible without one: it speaks the data-control protocols and
# has no fallback that would take focus instead — so a compositor
# offering neither reports the feature unavailable, which is the honest
# answer and the one GNOME and Cinnamon's Wayland sessions get.
# `image-data` stays off: this handles text and must never rewrite
# somebody's copied image.
arboard = { version = "3.6", default-features = false, features = [
    "wayland-data-control",
] }
# zbus's blocking API on its built-in async-io executor thread —
# explicitly NOT the `tokio` feature: no tokio in the tree. Already
# present transitively (notify-rust), so no new licences either.
zbus  = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# Suggestion tooltip (poltertype-popup): CPU rendering + Wayland
# layer-shell. All of these are already in the dependency tree via
# iced's tiny-skia renderer and tray-icon's Wayland support, so they
# add no new licences and almost no compile time.
tiny-skia   = "0.11"
cosmic-text = "0.12"
smithay-client-toolkit = "0.19"
wayland-client         = "0.31"

# Win32 API bindings (Microsoft official). Per-target deps in the
# crates that need them — features there select narrow modules.
windows-version = "0.1"

# Icon plumbing, build-time only — none of this is linked into the
# shipped binary. `png` encodes the installers' images and the `.ico`'s
# 256 px entry; `winresource` runs the Windows SDK's `rc.exe` over a
# generated resource script so `poltertype.exe` carries an icon and a
# VERSIONINFO block. Without that the Start menu draws a placeholder
# and the Details tab is blank.
png         = "0.17"
winresource = "0.1"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"
opt-level     = 3

# Dependencies are optimised even in a debug build; our own crates are
# not, so backtraces and stepping still work where the bugs are.
#
# This is not a build-time preference, it is what makes the Settings
# window usable in development. The window is rendered on the CPU
# (`iced`'s tiny-skia backend, no GPU stack — see the `iced` entry
# above), so every frame is rasterised by `tiny-skia` and shaped by
# `cosmic-text`, and unoptimised those two are the whole frame budget.
# Measured on the Plug-ins pane with a chat plug-in's room list open,
# scrolling for 6.5 s: 97% of a core unoptimised against 20% for the
# same code in release. That is the difference between a list that
# scrolls and one that stutters, and everyone running `cargo run` was
# getting the stuttering one.
#
# Costs one slow rebuild of the dependency tree, and nothing after that
# — the app's own crates are what get recompiled while working.
[profile.dev.package."*"]
opt-level = 3

