[workspace]
resolver = "2"
members = [
    "crates/poltertype-app",
    "crates/poltertype-core",
    "crates/poltertype-input",
    "crates/poltertype-layout",
    "crates/poltertype-detect",
    "crates/poltertype-update",
    "crates/poltertype-ai",
    "crates/poltertype-popup",
    "crates/poltertype-autostart",
    "crates/poltertype-shell",
    "crates/poltertype-tray",
    "crates/poltertype-types",
    "xtask",
]

[workspace.package]
version       = "0.6.2"
edition       = "2024"
license       = "MIT"
authors       = ["PolterType contributors"]
rust-version  = "1.85"
repository    = "https://github.com/Just-Code-NET/poltertype"
# Internal crates, distributed as the poltertype-app binary via GitHub
# Releases — never published to crates.io. (Also what lets
# cargo-deny accept the versionless path-only workspace deps.)
publish       = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all           = { level = "warn", priority = -1 }
unwrap_used   = "warn"
expect_used   = "warn"
panic         = "warn"
todo          = "allow"
unimplemented = "allow"

[workspace.dependencies]
# Internal crates
poltertype-types  = { path = "crates/poltertype-types" }
poltertype-input  = { path = "crates/poltertype-input" }
poltertype-layout = { path = "crates/poltertype-layout" }
poltertype-detect = { path = "crates/poltertype-detect" }
poltertype-core   = { path = "crates/poltertype-core" }
poltertype-update = { path = "crates/poltertype-update" }
poltertype-autostart = { path = "crates/poltertype-autostart" }
poltertype-shell  = { path = "crates/poltertype-shell" }
poltertype-ai     = { path = "crates/poltertype-ai" }
poltertype-popup  = { path = "crates/poltertype-popup" }
poltertype-tray   = { path = "crates/poltertype-tray" }

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender   = "0.2"

# Concurrency
crossbeam-channel = "0.5"
parking_lot       = "0.12"

# Serde / config
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"

# OS interop
directories = "5"
keyring     = "3"

# Errors
thiserror = "1"
anyhow    = "1"

# Event loop / tray / hotkeys / autostart / single instance
tao             = "0.30"
tray-icon       = "0.19"
global-hotkey   = "0.6"
single-instance = "0.3"
# Linux tray only (poltertype-tray): `tray-icon` already pulls this in
# via `libappindicator`, so pinning it here buys a handle on GLib's log
# router, not a new dependency. Keep the version in step with whatever
# `tray-icon` resolves, or two copies of glib land in the tree.
glib            = "0.18"

# Audio
rodio = "0.20"

# Notifications
notify-rust = "4"

# Bitflags for modifier sets, etc.
bitflags = "2"

# Compact immutable set/map for embedded dictionaries (BurntSushi).
fst = "0.4"

# Levenshtein DFAs for the suggestions engine: compiles a typed token
# into an edit-distance automaton that streams every dictionary word
# within distance N straight off the surface FST. NOT fst's built-in
# `levenshtein` feature — that automaton mismatches multibyte (Cyrillic)
# queries entirely (even `слово` within d=1 of itself finds nothing).
# This crate (tantivy's) handles UTF-8 correctly and counts adjacent
# transpositions as single edits, which matches how humans mistype.
levenshtein_automata = "0.2"

# Cross-platform "open this file in the user's default app".
opener = "0.7"

# Auto-update (poltertype-update only). `ureq` is blocking and
# rustls-backed — no async runtime, no OpenSSL, and it is already the
# HTTP client xtask uses to fetch wordlists, so the dependency tree
# (and its licence set in deny.toml) is vetted. `sha2` verifies the
# downloaded artifact against the checksum in the release manifest;
# `semver` decides "is the published version actually newer than us".
ureq   = { version = "2", features = ["tls", "json"] }
sha2   = "0.10"
semver = "1"

# GUI for the Settings window. `tiny-skia` is iced's pure-CPU
# renderer (no wgpu / GPU stack) — keeps the binary small and the
# build snappy, which matters because we open this window rarely.
# `advanced` exposes the lower-level layout/widget API used for the
# custom side-nav. `canvas` draws the vector brand mark in the
# Settings sidebar — far lighter than pulling an SVG renderer
# (resvg) in for one static logo.
iced = { version = "0.13", default-features = false, features = [
    "tiny-skia",
    "advanced",
    "auto-detect-theme",
    "canvas",
] }

# Linux: evdev / X11. (poltertype-layout's D-Bus access stays a
# shell-out to canonical CLI tools — see crates/poltertype-layout/
# src/linux/ — those are one-shot queries. The AT-SPI caret watcher
# in poltertype-input needs a long-lived signal subscription, which a
# CLI shell-out cannot provide, so it links zbus directly.)
evdev = "0.13"
x11rb = "0.13"
# zbus's blocking API on its built-in async-io executor thread —
# explicitly NOT the `tokio` feature: no tokio in the tree. Already
# present transitively (notify-rust), so no new licences either.
zbus  = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# Suggestion tooltip (poltertype-popup): CPU rendering + Wayland
# layer-shell. All of these are already in the dependency tree via
# iced's tiny-skia renderer and tray-icon's Wayland support, so they
# add no new licences and almost no compile time.
tiny-skia   = "0.11"
cosmic-text = "0.12"
smithay-client-toolkit = "0.19"
wayland-client         = "0.31"

# Win32 API bindings (Microsoft official). Per-target deps in the
# crates that need them — features there select narrow modules.
windows-version = "0.1"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"
opt-level     = 3

