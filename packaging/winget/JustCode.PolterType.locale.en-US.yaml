ShortDescription: Detects text typed in the wrong keyboard layout, switches the layout and fixes the word.
Description: |-
  PolterType is a tray-only desktop app for people who type in more than
  one language. When a word comes out as ghbdtn instead of привет, it
  notices, switches the keyboard layout, and retypes the word — without
  you reaching for the mouse.

  It runs entirely on your machine. Typed text is never logged and never
  leaves the computer; the only network request the app makes is the
  update check, which sends nothing about you and can be switched off.

  Note: the installer is not code-signed yet, so SmartScreen may warn on
  first run.
