[package]
name                  = "poltertype-popup"
description           = "Suggestion tooltip: a tiny focus-stealing-free overlay window per OS."
version.workspace     = true
edition.workspace     = true
license.workspace     = true
authors.workspace     = true
rust-version.workspace = true
repository.workspace  = true
publish.workspace     = true

[lints]
workspace = true

[dependencies]
crossbeam-channel = { workspace = true }
thiserror         = { workspace = true }
tracing           = { workspace = true }
tiny-skia         = { workspace = true }
cosmic-text       = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { workspace = true }
wayland-client         = { workspace = true }
x11rb                  = { workspace = true }

# `Gdi` is the layered-window surface (a DIB section handed to
# UpdateLayeredWindow); `HiDpi` is the per-monitor scale the renderer
# draws at. Same major as poltertype-input's, so one `windows` crate
# is linked rather than two.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }
