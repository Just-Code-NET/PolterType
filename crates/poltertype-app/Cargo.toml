[package]
name                  = "poltertype-app"
description           = "PolterType: cross-platform automatic keyboard layout switcher (tray app)."
version.workspace     = true
edition.workspace     = true
license.workspace     = true
authors.workspace     = true
rust-version.workspace = true
repository.workspace  = true
publish.workspace     = true

[lints]
workspace = true

[[bin]]
name = "poltertype"
path = "src/main.rs"

# Build-time only — neither of these is linked into the binary. They
# put an icon and a VERSIONINFO block into `poltertype.exe`; see
# build.rs. Unconditional rather than `[target.'cfg(windows)']`,
# because build-dependency cfgs are evaluated against the *host* and
# the question here is about the target.
[build-dependencies]
poltertype-icon = { workspace = true }
winresource     = { workspace = true }

[features]
default = []
ai      = ["dep:poltertype-ai"]

[dependencies]
poltertype-types  = { workspace = true }
poltertype-core   = { workspace = true }
poltertype-input  = { workspace = true }
poltertype-layout = { workspace = true }
poltertype-detect = { workspace = true }
poltertype-update = { workspace = true }
poltertype-popup  = { workspace = true }
poltertype-tray   = { workspace = true }
poltertype-autostart = { workspace = true }
poltertype-shell  = { workspace = true }
# The brand mark, for the Settings window's own icon. Same geometry
# build.rs embeds into the executable — one source, so the window and
# the Start-menu entry can never wear different marks.
poltertype-icon   = { workspace = true }

# Both poltertype-input and poltertype-layout already depend on this; we re-pull it
# here so Cargo's feature unification keeps everyone on the same view.
poltertype-ai     = { workspace = true, optional = true }

anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender   = { workspace = true }
crossbeam-channel  = { workspace = true }
parking_lot        = { workspace = true }

tao             = { workspace = true }
tray-icon       = { workspace = true }
global-hotkey   = { workspace = true }
opener          = { workspace = true }
iced            = { workspace = true }
# Tiny system notifications for "PolterType just auto-switched
# your layout" — gated by `[general].show_notifications` (off by
# default). Cross-platform: Win10+ Toast, macOS NSUserNotification,
# Linux Desktop Notifications spec via DBus.
notify-rust     = { workspace = true }
