[package]
name                  = "kb-core"
description           = "Switcher engine, settings, focus tracking, audio."
version.workspace     = true
edition.workspace     = true
license.workspace     = true
authors.workspace     = true
rust-version.workspace = true
repository.workspace  = true

[lints]
workspace = true

[build-dependencies]
fst    = { workspace = true }
# Wordlist sources are gzipped on disk (`data/wordlists/<id>.txt.gz`)
# so the repo stays under 30 MB — uncompressed they balloon to ~165 MB
# after Hunspell affix expansion. `flate2` decodes the stream on the
# fly inside `build.rs`; the FST builder consumes the decompressed
# words directly without an intermediate decompressed file.
flate2 = "1"

[dependencies]
kb-types          = { workspace = true }
kb-input          = { workspace = true }
kb-layout         = { workspace = true }
kb-detect         = { workspace = true }

serde             = { workspace = true }
toml              = { workspace = true }
directories       = { workspace = true }
crossbeam-channel = { workspace = true }
parking_lot       = { workspace = true }
thiserror         = { workspace = true }
tracing           = { workspace = true }
rodio             = { workspace = true }
fst               = { workspace = true }
# Used by smart-command actions (`OpenPath`) to launch files / URLs
# in the user's default handler. Same crate kb-app uses for its
# tray "Open …" menu entries — keeps the platform-specific glue
# in one place.
opener            = { workspace = true }

[dev-dependencies]
# nothing yet
