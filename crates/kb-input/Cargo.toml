[package]
name                  = "kb-input"
description           = "Per-OS global keyboard listener for kb-switcher."
version.workspace     = true
edition.workspace     = true
license.workspace     = true
authors.workspace     = true
rust-version.workspace = true
repository.workspace  = true

[lints]
workspace = true

[dependencies]
kb-types          = { workspace = true }
crossbeam-channel = { workspace = true }
parking_lot       = { workspace = true }
thiserror         = { workspace = true }
tracing           = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland-first: evdev requires the user to be in the `input` group.
# AT-SPI (atspi crate) is the no-sudo fallback and lands in Phase 6.
evdev = "0.13"
