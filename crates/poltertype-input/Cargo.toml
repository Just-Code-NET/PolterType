[package]
name                  = "poltertype-input"
description           = "Per-OS global keyboard listener for poltertype."
version.workspace     = true
edition.workspace     = true
license.workspace     = true
authors.workspace     = true
rust-version.workspace = true
repository.workspace  = true
publish.workspace     = true

[lints]
workspace = true

[dependencies]
poltertype-types          = { workspace = true }
crossbeam-channel = { workspace = true }
parking_lot       = { workspace = true }
thiserror         = { workspace = true }
tracing           = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation     = "0.10"
core-graphics       = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland-first: evdev requires the user to be in the `input` group.
# AT-SPI (atspi crate) is the no-sudo fallback and lands in Phase 6.x.
evdev = { workspace = true }
# `xinput` = XInput2 raw key events (the X11 listener); `xtest` =
# XTestFakeInput (the X11 emitter). Both are opt-in features in x11rb —
# the default build ships no protocol extensions at all.
x11rb = { workspace = true, features = ["xinput", "xtest"] }
# Used only to flip O_NONBLOCK on the evdev FDs we open. `evdev` 0.13's
# `fetch_events` is blocking by default; our single-thread fan-in
# would otherwise deadlock on the first device that has no traffic.
libc  = "0.2"
# AT-SPI2 a11y bus (focus/linux_impl/atspi_caret.rs) — the only real
# source of on-screen caret coordinates on Linux. Blocking API only;
# the watcher owns one background thread, no async runtime of ours.
zbus  = { workspace = true }
directories = { workspace = true }
