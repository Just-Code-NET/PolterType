# ── pane footnotes ───────────────────────────────────────────────────
"languages.tip" = "Порада: «Активна» — це список дозволених; поки нічого не обмежено, враховуються всі розкладки системи. «Ігнорувати» — жорстке вето, воно завжди сильніше."
"hotkeys.tip" = "Порада: комбінація потребує щонайменше одного з {} — сама по собі клавіша конфліктувала б із набором тексту, і Caps Lock тут єдиний виняток. Самі модифікатори теж рахуються: утримайте два разом ({}) або двічі торкніться одного ({}). Вони спрацьовують на відпусканні й лише якщо між тим нічого не натискали, тож не заважають комбінаціям, частиною яких є. Esc скасовує захоплення, нічого не змінюючи."
"hotkeys.also_convert_selection" = "Також перетворювати виділений текст"
"commands.tip" = "Поради: беріть тригери, що не збігаються зі словами, які ви справді набираєте — «the» спрацьовував би в кожному англійському реченні, а `;sig` чи `((email))` безпечніші. Збіг точний і чутливий до регістру. Лишіть «Програми» порожнім для глобальної команди або перелічіть `OUTLOOK.EXE,thunderbird.exe`, щоб обмежити її (збіг за іменем файлу, без урахування регістру)."
"wordlists.tip" = "Порада: «Додаткові» допомагають розпізнаванню віддавати перевагу вашому жаргону, назвам проєктів чи іменам. «Стоп-список» розширює перелік одно- й дволітерних записів, які детектор вважає справжніми словами, а не помилками."
"wordlists.editor_placeholder" = "# одне слово в рядку — «#» починає коментар\n"
"exceptions.tip" = "Збіг за іменем файлу без урахування регістру — працюють і `code.exe`, і `Code.exe`."
"suggestions.tip" = "Порада: підказки беруться з тих самих вбудованих словників, якими вже користується детектор. Усе обчислюється локально — нічого з набраного не залишає ваш комп'ютер."

