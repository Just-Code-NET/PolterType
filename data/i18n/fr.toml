# ── pane footnotes ───────────────────────────────────────────────────
"languages.tip" = "Astuce : « Active » est la liste blanche — tant que rien n'est restreint, toutes les dispositions du système sont incluses. « Ignorer » est un veto absolu et l'emporte toujours."
"hotkeys.tip" = "Astuce : une combinaison exige au moins un {} — une touche seule entrerait en conflit avec la frappe, et le verrouillage majuscules est la seule exception. Les modificateurs seuls comptent aussi : maintenez-en deux ensemble ({}) ou appuyez deux fois sur l'un ({}). Ceux-ci se déclenchent au relâchement, et seulement si rien d'autre n'a été pressé entre-temps : ils laissent donc tranquilles les raccourcis dont ils font partie. Échap annule la capture sans rien changer."
"hotkeys.also_convert_selection" = "Convertir aussi le texte sélectionné"
"commands.tip" = "Astuces : choisissez des déclencheurs qui n'entrent pas en conflit avec des mots que vous tapez vraiment — `the` se déclencherait dans toute phrase anglaise, tandis que `;sig` ou `((email))` sont plus sûrs. La correspondance est exacte et sensible à la casse. Laissez « Applications » vide pour une commande globale, ou indiquez `OUTLOOK.EXE,thunderbird.exe` pour la restreindre (comparaison du nom de fichier, insensible à la casse)."
"wordlists.tip" = "Astuce : les « Compléments » aident la détection à privilégier votre jargon, vos noms de projets ou vos noms de famille. La « Liste d'exceptions » étend les entrées d'une ou deux lettres que le détecteur accepte comme de vrais mots plutôt que comme des fautes."
"wordlists.editor_placeholder" = "# un mot par ligne — « # » commence un commentaire\n"
"exceptions.tip" = "La comparaison porte sur le nom du fichier, sans tenir compte de la casse — `code.exe` et `Code.exe` fonctionnent tous les deux."
"suggestions.tip" = "Astuce : les suggestions proviennent des mêmes dictionnaires fournis que ceux déjà utilisés par le détecteur. Tout est calculé localement — rien de ce que vous tapez ne quitte votre machine."

