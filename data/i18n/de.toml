# ── pane footnotes ───────────────────────────────────────────────────
"languages.tip" = "Tipp: „Aktiv“ ist die Positivliste — solange nichts eingeschränkt ist, sind alle Belegungen des Systems dabei. „Ignorieren“ ist ein hartes Veto und gewinnt immer."
"hotkeys.tip" = "Tipp: Eine Kombination braucht mindestens eines von {} — eine Taste allein würde mit dem Tippen kollidieren, und die Feststelltaste ist die einzige Ausnahme. Modifikatoren allein zählen auch: zwei zusammen halten ({}) oder einen zweimal antippen ({}). Diese greifen beim Loslassen und nur, wenn dazwischen nichts anderes gedrückt wurde, sie stören also die Kürzel nicht, zu denen sie gehören. Esc bricht die Aufnahme ab, ohne etwas zu ändern."
"hotkeys.also_convert_selection" = "Auch markierten Text umwandeln"
"commands.tip" = "Tipps: Wählen Sie Auslöser, die nicht mit Wörtern kollidieren, die Sie wirklich tippen — `the` würde in jedem englischen Satz aufgehen; `;sig` oder `((email))` sind sicherer. Die Übereinstimmung ist exakt und beachtet Groß- und Kleinschreibung. Lassen Sie „Anwendungen“ leer für einen globalen Befehl, oder tragen Sie `OUTLOOK.EXE,thunderbird.exe` ein, um ihn einzugrenzen (Dateiname, ohne Beachtung der Groß-/Kleinschreibung)."
"wordlists.tip" = "Tipp: „Zusätze“ hilft der Erkennung, Ihren Fachjargon, Projektnamen oder Familiennamen zu bevorzugen. Die „Ausnahmeliste“ erweitert die ein- und zweibuchstabigen Einträge, die der Detektor als echte Wörter statt als Vertipper akzeptiert."
"wordlists.editor_placeholder" = "# ein Wort pro Zeile — „#“ beginnt einen Kommentar\n"
"exceptions.tip" = "Verglichen wird der Dateiname ohne Beachtung der Groß-/Kleinschreibung — `code.exe` und `Code.exe` funktionieren beide."
"suggestions.tip" = "Tipp: Die Vorschläge stammen aus denselben mitgelieferten Wörterbüchern, die der Detektor schon nutzt. Alles wird lokal berechnet — nichts von dem, was Sie tippen, verlässt Ihren Rechner."

