# Spanish translation of the PolterType settings window.
#
# Format: one flat table of `key = "text"`. The key is stable; the
# English original lives in the source at each call site and is what
# you get when a key is missing here, so an incomplete file is safe —
# untranslated strings simply stay English.
#
# An empty value counts as "not translated yet" and is ignored, so
# leaving `key = ""` in place is fine and better than a placeholder.
#
# `{}` marks a value substituted at run time, in order. Keep the same
# number of them as the English unless your language genuinely needs
# fewer; extras are left visible rather than crashing anything.
#
# Do not translate: the product name PolterType, layout ids (en-US),
# config keys, and file names.

