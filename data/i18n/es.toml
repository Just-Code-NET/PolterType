# ── pane footnotes ───────────────────────────────────────────────────
"languages.tip" = "Consejo: «Activo» es la lista de permitidos; mientras no se restrinja nada, se incluyen todas las distribuciones del sistema. «Ignorar» es un veto absoluto y siempre gana."
"hotkeys.tip" = "Consejo: una combinación necesita al menos uno de {}; una tecla suelta chocaría con la escritura, y Bloq Mayús es la única excepción. Los modificadores solos también cuentan: mantén dos a la vez ({}) o pulsa uno dos veces ({}). Estos actúan al soltar las teclas, y solo si no se pulsó nada más entremedias, así que no estorban a los atajos de los que forman parte. Esc cancela la captura sin cambiar nada."
"hotkeys.also_convert_selection" = "Convertir también el texto seleccionado"
"commands.tip" = "Consejos: elige disparadores que no choquen con palabras que escribas de verdad; `the` se expandiría en cualquier frase en inglés, mientras que `;sig` o `((email))` son más seguros. La coincidencia es exacta y distingue mayúsculas. Deja «Aplicaciones» vacío para un comando global, o pon `OUTLOOK.EXE,thunderbird.exe` para limitarlo (coincidencia por nombre de archivo, sin distinguir mayúsculas)."
"wordlists.tip" = "Consejo: «Adicionales» ayuda a que la detección prefiera tu jerga, los nombres de tus proyectos o apellidos. La «Lista de excepciones» amplía las entradas de una o dos letras que el detector acepta como palabras reales en vez de erratas."
"wordlists.editor_placeholder" = "# una palabra por línea — «#» empieza un comentario\n"
"exceptions.tip" = "La coincidencia no distingue mayúsculas y se hace sobre el nombre del archivo: valen tanto `code.exe` como `Code.exe`."
"suggestions.tip" = "Consejo: las sugerencias salen de los mismos diccionarios que ya usa el detector. Todo se calcula localmente; nada de lo que escribes sale de tu equipo."

