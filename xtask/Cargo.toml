[package]
name                  = "xtask"
description           = "Internal build / dev helper commands."
version               = "0.0.0"
edition.workspace     = true
license.workspace     = true
authors.workspace     = true
rust-version.workspace = true
publish               = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
ureq   = { version = "2", features = ["tls"] }

# `manifest sign` — the other half of the updater's signature check.
# `poltertype-update` is here for `Manifest` and `signing_payload`: the
# app and this tool must render the signed bytes with the same code, or
# a signature that verifies locally fails for every user. Unlike the
# app, this end needs the signing half of ed25519, so the default
# features (which include `zeroize` for the secret) stay on.
poltertype-update = { workspace = true }
ed25519-dalek     = { version = "3" }
base64            = { workspace = true }
serde_json        = { workspace = true }
getrandom         = "0.2"

# Backs the `assets icon-png` / `assets icon-ico` subcommands. The
# geometry is shared with `poltertype-app`'s build script, which embeds
# the same mark into the executable — keeps the repo binary-asset-free
# while still letting the installers and the exe agree on one icon.
poltertype-icon = { workspace = true }

# Bulk wordlist outputs are gzipped (`data/wordlists/<id>.txt.gz`)
# because uk_ua alone hits 84 MB raw after Hunspell affix expansion.
# Same crate (`flate2`) used at build time in `poltertype-core/build.rs` for
# decoding.
flate2 = "1"
