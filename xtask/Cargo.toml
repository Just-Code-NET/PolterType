[package]
name                  = "xtask"
description           = "Internal build / dev helper commands."
version               = "0.0.0"
edition.workspace     = true
license.workspace     = true
authors.workspace     = true
rust-version.workspace = true
publish               = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
ureq   = { version = "2", features = ["tls"] }

# Used by the `assets icon-png` subcommand to generate the placeholder
# 1024×1024 source PNG that release CI then converts to per-platform
# icon formats (.ico, .icns) — keeps the repo binary-asset-free while
# still letting the installers ship with a non-default icon.
png    = "0.17"
